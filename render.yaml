# Render.com Build Configuration
# ================================
# This file tells Render how to deploy your server

services:
  - type: web
    name: ytb-server
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y ffmpeg
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: true
    healthCheckPath: /health
